spring:
  application:
    name: backend
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  ai:
    openai:
      api-key: ${SPRING_AI_OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
      audio:
        transcription:
          options:
            model: whisper-1
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

jwt:
  secret: ${JWT_SECRET:default-secret-key-for-development-must-be-at-least-32-bytes}
  access-expiration: 900
  refresh-expiration: 2592000

oauth2:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    # ID 토큰 aud 검증 화이트리스트. 웹/데스크톱(Electron) client ID를 콤마로 구분해 등록.
    # 비워두면 aud 검증을 건너뜀(개발 편의).
    allowed-client-ids: ${GOOGLE_ALLOWED_CLIENT_IDS:}
  kakao:
    client-id: ${KAKAO_CLIENT_ID:}

firebase:
  credentials-path: ${FIREBASE_CREDENTIALS_PATH}

supabase:
  url: ${SUPABASE_URL}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY}
  storage:
    bucket: ${SUPABASE_STORAGE_BUCKET:chat-media}

cors:
  # allowedOriginPatterns로 적용되므로 와일드카드(*) 사용 가능
  allowed-origins:
    - https://repave-radiation-deflector.ngrok-free.dev
    - ${FRONTEND_URL:http://localhost:8081}
    # 개발: Electron 렌더러 dev 서버 (Vite 5173 등 임의 포트)
    - http://localhost:*
    - http://127.0.0.1:*
    # 배포: Electron 렌더러 커스텀 스킴 (file:// 대신 app:// 스킴 권장)
    - app://*

decorator:
  datasource:
    p6spy:
      enable-logging: true

logging:
  level:
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF